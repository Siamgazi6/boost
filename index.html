
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google Redirect Generator</title>
<style>
body{font-family:Arial;background:#f4f6fa;padding:30px}
.container{max-width:500px;margin:50px auto;background:white;padding:25px;border-radius:12px}
input,button{width:100%;padding:13px;margin:10px 0;box-sizing:border-box}
button{background:#4285f4;color:white;border:0;border-radius:6px;cursor:pointer}
#result{word-break:break-all}
</style>
</head>
<body>
<div class="container">
<h2>Google Redirect Generator</h2>
<input id="url" type="url" placeholder="Enter Website URL">
<button onclick="generate()">Generate Link</button>
<p id="result"></p>
<button onclick="copyLink()">Copy Link</button>
</div>
<script>
let generatedLink = "";

function generate(){
  try {
    const target = new URL(document.getElementById("url").value);
    if (!["http:", "https:"].includes(target.protocol)) throw Error();
    generatedLink =
      "https://www.google.com/url?q=" +
      encodeURIComponent(target.href) + "&sa=D";
    document.getElementById("result").textContent = generatedLink;
  } catch {
    document.getElementById("result").textContent =
      "Please enter a valid HTTP or HTTPS URL.";
  }
}

function copyLink(){
  if(generatedLink) navigator.clipboard.writeText(generatedLink);
}
</script>
</body>
</html>
